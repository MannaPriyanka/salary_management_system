# PostgreSQL. Versions 9.5 and up are supported.
#
# Connection settings come from environment variables. Leave them unset to use the local
# defaults: a Unix socket and the operating system user, as with a plain `psql` on this machine.
#
#   DATABASE_HOST      e.g. localhost (unset = Unix socket)
#   DATABASE_PORT      default 5432
#   DATABASE_USERNAME  unset = the operating system user
#   DATABASE_PASSWORD  unset = no password
#
# For Docker Compose (docker-compose.yml) use: DATABASE_HOST=localhost DATABASE_USERNAME=postgres
# DATABASE_PASSWORD=postgres.
#
# Production uses DATABASE_URL (merged over these values) or the SALARY_APP_* variables below.
# Never put real passwords in this file.

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV["DATABASE_HOST"].presence %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV["DATABASE_USERNAME"].presence %>
  password: <%= ENV["DATABASE_PASSWORD"].presence %>
  # Connection pool size. See https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: salary_app_development

# Warning: the "test" database is erased and rebuilt by the test suite.
# Never point it at the development or production database.
test:
  <<: *default
  database: salary_app_test

production:
  <<: *default
  database: salary_app_production
  username: <%= ENV.fetch("SALARY_APP_DATABASE_USER", "salary_app") %>
  password: <%= ENV["SALARY_APP_DATABASE_PASSWORD"].presence %>
